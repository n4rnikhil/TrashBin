# Base configuration. Every environment-specific value is read from environment variables
# (optionally loaded from backend/.env). Nothing sensitive has a default here.
# Reference: docs/SYSTEM_ARCHITECTURE.md "Configuration reference".
spring:
  application:
    name: trashbin
  profiles:
    default: dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${TRASHBIN_DB_URL}
    username: ${TRASHBIN_DB_USERNAME}
    password: ${TRASHBIN_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080
  # Honor X-Forwarded-For from the Next.js proxy. Tomcat only trusts loopback/private peers by
  # default, so the header cannot be spoofed from outside.
  forward-headers-strategy: native
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# OpenAPI documentation is off unless a profile turns it on (dev, test).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

trashbin:
  storage:
    root: ${TRASHBIN_STORAGE_ROOT}
  content:
    ticket-secret: ${TRASHBIN_TICKET_SECRET}
    download-ticket-ttl: ${TRASHBIN_DOWNLOAD_TICKET_TTL:PT60S}
    preview-ticket-ttl: ${TRASHBIN_PREVIEW_TICKET_TTL:PT5M}
  lifecycle:
    retention-days: ${TRASHBIN_RETENTION_DAYS:30}
  extraction:
    background: true
    max-input: ${TRASHBIN_EXTRACTION_MAX_INPUT_MB:50}MB
    max-chars: ${TRASHBIN_EXTRACTION_MAX_CHARS:1000000}
    timeout: ${TRASHBIN_EXTRACTION_TIMEOUT:PT30S}
    batch-size: 20
  upload:
    max-file-size: ${TRASHBIN_MAX_FILE_SIZE_MB:250}MB
    user-quota: ${TRASHBIN_USER_QUOTA_GB:5}GB
    blocked-extensions: ${TRASHBIN_BLOCKED_EXTENSIONS:}
  auth:
    jwt-secret: ${TRASHBIN_JWT_SECRET}
    access-token-ttl: ${TRASHBIN_ACCESS_TOKEN_TTL:PT10M}
    refresh-token-ttl: ${TRASHBIN_REFRESH_TOKEN_TTL:P14D}
    refresh-token-max-age: ${TRASHBIN_REFRESH_TOKEN_MAX_AGE:P30D}
    refresh-reuse-grace: PT20S
    cookie-secure: ${TRASHBIN_COOKIE_SECURE:false}
    registration-enabled: ${TRASHBIN_REGISTRATION_ENABLED:true}
    allowed-origin: ${TRASHBIN_ALLOWED_ORIGIN:http://localhost:3000}
    rate-limit-per-minute: ${TRASHBIN_AUTH_RATE_LIMIT_PER_MINUTE:10}
    bcrypt-cost: 12
    max-failed-logins: 5
    lock-duration: PT15M
    bootstrap-admin-email: ${TRASHBIN_BOOTSTRAP_ADMIN_EMAIL:}
