# Test profile: isolated database and a throwaway storage directory.
spring:
  datasource:
    url: ${TRASHBIN_TEST_DB_URL}
    username: ${TRASHBIN_TEST_DB_USERNAME}
    password: ${TRASHBIN_TEST_DB_PASSWORD}

springdoc:
  api-docs:
    enabled: true

trashbin:
  storage:
    root: ${java.io.tmpdir}/trashbin-test-storage
  auth:
    # Fixed, test-only signing key (Base64 of 48 arbitrary bytes). Never used outside tests.
    jwt-secret: dGVzdC1vbmx5LXNpZ25pbmcta2V5LWZvci10cmFzaGJpbi1pbnRlZ3JhdGlvbi10ZXN0cw==
    rate-limit-per-minute: 100000
    bcrypt-cost: 4
    bootstrap-admin-email: admin@example.com
  content:
    # Test-only key (Base64), deliberately different from the JWT test key.
    ticket-secret: dGVzdC1vbmx5LXRpY2tldC1rZXktLWRpZmZlcmVudC1mcm9tLXRoZS1qd3Qta2V5IQ==
  extraction:
    # Tests trigger extraction explicitly so assertions never race a background thread.
    background: false
    max-input: 512KB
    max-chars: 2000
  upload:
    max-file-size: 1MB
    user-quota: 3MB
    blocked-extensions: exe,.SCR

